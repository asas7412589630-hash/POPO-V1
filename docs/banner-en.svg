<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="POPO V1 — 多模型破甲代理">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="0.55" stop-color="#231f1c"/>
      <stop offset="1" stop-color="#0f0d0c"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.12" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember2" cx="0.95" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
    <style>
      .f { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans CJK TC",
                      "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo,
                        Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#ember)"/>
  <rect width="1280" height="400" fill="url(#ember2)"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="5" height="400" fill="url(#rule)"/>

  <!-- kicker -->
  <text class="mono" x="64" y="74" fill="#f59e0b" font-size="13" letter-spacing="4.2">PRISM · MULTI-MODEL ARMOUR PROXY</text>

  <!-- title -->
  <text class="f" x="62" y="146" fill="#fafaf9" font-size="62" font-weight="700" letter-spacing="-1.5">Prism</text>

  <!-- tagline -->
  <text class="f" x="64" y="192" fill="#d6d3d1" font-size="21">One beam in, <tspan fill="#f59e0b" font-weight="700">the one line you want out.</tspan></text>
  <text class="f" x="64" y="224" fill="#a8a29e" font-size="15.5">
    OpenAI-compatible · per-family personas · refusal retry · zero-disk mode
  </text>

  <!-- flow diagram -->
  <g transform="translate(64,268)">
    <!-- box 1 -->
    <rect x="0" y="0" width="196" height="66" rx="9" fill="#262322" stroke="#3f3a36" stroke-width="1.2"/>
    <text class="mono" x="16" y="27" fill="#78716c" font-size="10.5" letter-spacing="1.6">YOUR CLIENT</text>
    <text class="f" x="16" y="49" fill="#e7e5e4" font-size="15" font-weight="600">Any OpenAI client</text>

    <line x1="200" y1="33" x2="238" y2="33" stroke="#c2410c" stroke-width="2" marker-end="url(#arw)"/>

    <!-- box 2 (highlighted) -->
    <rect x="244" y="-6" width="286" height="78" rx="11" fill="#2a1a12" stroke="#c2410c" stroke-width="1.8"/>
    <text class="mono" x="262" y="22" fill="#f59e0b" font-size="10.5" letter-spacing="1.6">THIS PROXY</text>
    <text class="f" x="262" y="45" fill="#fafaf9" font-size="16" font-weight="700">Persona · retry · log</text>
    <text class="f" x="262" y="63" fill="#a8a29e" font-size="11.5">34,059 chars of armour, per family</text>

    <line x1="534" y1="33" x2="572" y2="33" stroke="#c2410c" stroke-width="2" marker-end="url(#arw)"/>

    <!-- box 3 -->
    <rect x="578" y="0" width="196" height="66" rx="9" fill="#262322" stroke="#3f3a36" stroke-width="1.2"/>
    <text class="mono" x="594" y="27" fill="#78716c" font-size="10.5" letter-spacing="1.6">UPSTREAM</text>
    <text class="f" x="594" y="49" fill="#e7e5e4" font-size="15" font-weight="600">Your provider /v1</text>

    <!-- out badge -->
    <line x1="778" y1="33" x2="816" y2="33" stroke="#c2410c" stroke-width="2" marker-end="url(#arw)"/>
    <rect x="822" y="4" width="176" height="58" rx="29" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text class="f" x="846" y="38" fill="#f59e0b" font-size="14.5" font-weight="700">Armoured API</text>
  </g>

  <!-- right side: model families -->
  <g transform="translate(1084,96)">
    <text class="mono" x="0" y="0" fill="#57534e" font-size="10" letter-spacing="1.8">SUPPORTED</text>
    <g class="mono" font-size="12.5" fill="#a8a29e">
      <text x="0" y="26">glm</text>
      <text x="0" y="48">deepseek</text>
      <text x="0" y="70">gpt</text>
      <text x="0" y="92">+ generic</text>
    </g>
  </g>

  <!-- footer -->
  <line x1="64" y1="368" x2="1216" y2="368" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="f" x="64" y="390" fill="#57534e" font-size="11.5">Made by yuangeluyou.com :)</text>
  <text class="mono" x="1216" y="390" fill="#57534e" font-size="10.5" text-anchor="end" letter-spacing="1.2">CC BY-NC 4.0 · PYTHON 3.9+ · NO DEPENDENCIES</text>
</svg>
