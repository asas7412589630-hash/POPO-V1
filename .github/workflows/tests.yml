name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: offline (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Architecture guardrails
        run: python tools/architecture_check.py

      - name: Release tree hygiene
        run: python tools/check_release_tree.py --allow-runtime

      - name: Byte-compile
        run: python -m compileall -q popo console tools tests

      - name: Unit tests
        run: python -m unittest discover -s tests/unit

      - name: Integration tests
        run: python -m unittest discover -s tests/integration

      - name: Behaviour parity against V1
        run: python tests/parity/v1_v2_parity.py

      - name: Capability parity
        run: python -m unittest discover -s tests/parity -p "test_*.py"

  release:
    name: release artifact
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the archive twice
        run: |
          python tools/build_release.py --output /tmp/first.tar.gz
          python tools/build_release.py --output /tmp/second.tar.gz

      - name: Reproducibility check
        run: |
          a=$(sha256sum /tmp/first.tar.gz | cut -d' ' -f1)
          b=$(sha256sum /tmp/second.tar.gz | cut -d' ' -f1)
          echo "first=$a"
          echo "second=$b"
          test "$a" = "$b"

      - name: Verify the archive as shipped
        run: |
          mkdir -p /tmp/unpacked
          tar -xzf /tmp/first.tar.gz -C /tmp/unpacked
          cd /tmp/unpacked/POPO-*
          python tools/check_release_tree.py
          python tools/architecture_check.py
          python -m unittest discover -s tests/unit
          python tests/parity/v1_v2_parity.py

      - name: Publish checksum
        run: sha256sum /tmp/first.tar.gz | tee release.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: popo-release
          path: |
            /tmp/first.tar.gz
            release.sha256
